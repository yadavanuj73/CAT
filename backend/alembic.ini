# Alembic configuration for CAT Intelligence 2026
# -------------------------------------------------

[alembic]
# Path to the migration scripts directory (relative to this file).
script_location = alembic

# Template used to generate migration files.
# file_template = %%(rev)s_%%(slug)s

# sys.path / prepend path so that "backend.app" is importable.
prepend_sys_path = .

# Timezone to use when rendering the "create_date" into the migration file.
timezone = UTC

# The SQLAlchemy connection URL.
# Override at runtime via the ``SQLALCHEMY_DATABASE_URL`` env-var in env.py.
sqlalchemy.url = postgresql+asyncpg://postgres:postgres@localhost:5432/cat2026

# Logging ----------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
