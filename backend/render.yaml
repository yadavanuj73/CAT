services:
  - type: web
    name: cat-intelligence-2026-api
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: MASTER_ENCRYPTION_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://cat-intelligence-2026.vercel.app
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 60
      - key: SESSION_EXPIRE_MINUTES
        value: 120
      - key: MAX_UPLOAD_SIZE_MB
        value: 50
